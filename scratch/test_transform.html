<!DOCTYPE html>
<html>
<head>
<style>
.outer {
  width: 400px; height: 300px;
  border: 1px solid black;
  overflow-y: auto; overflow-x: hidden;
  position: relative;
}
.inner {
  transform-origin: top left;
  transform: scale(0.5);
  width: 200%; /* 100 / 0.5 */
  /* height is tricky. If we don't scale height, it will leave a gap */
}
.content {
  background: lightblue;
  height: 800px;
}
</style>
</head>
<body>
<div class="outer">
  <div class="inner">
    <div class="content">Content</div>
  </div>
</div>
</body>
</html>
